<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>borut.ch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<main class="wrapper">
  <section class="brand">
    <h1><span class="name">borut</span><span class="tld">.ch</span></h1>
    <div class="line"></div>

    <h2>Digital.<br>Simplified.</h2>

    <p class="subtitle">Your partner in digitalization.</p>
  </section>

  <section class="contact">
    <h3>GET IN TOUCH</h3>

    <form id="contactForm">

    <input
        type="text"
        name="name"
        placeholder="Your name"
        required>

    <input
        type="email"
        name="email"
        placeholder="Your email"
        required>

    <input
        type="text"
        name="subject"
        placeholder="Subject"
        required>

    <textarea
        name="message"
        placeholder="Your message"
        required></textarea>
<div
  class="cf-turnstile"
  data-sitekey="0x4AAAAAAEExY8E-2u6qaQJo">
</div>
   <button type="submit">
    SEND MESSAGE →
</button>

<div id="form-message" class="form-message"></div>

</form>
  </section>
</main>

<footer>© 2026 borut.ch</footer>
<script src="script.js"></script>
</body>
</html>
